namespace: resolvehub
imagePullPolicy: IfNotPresent
backend:
  image: ghcr.io/YOUR_GITHUB_USERNAME/resolvehub-backend
  tag: latest
  replicas: 2
  port: 8000
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
frontend:
  image: ghcr.io/YOUR_GITHUB_USERNAME/resolvehub-frontend
  tag: latest
  replicas: 2
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 300m, memory: 256Mi}
database:
  name: resolvehub
  user: resolvehub
  password: change-me-before-deploying
  storage: 5Gi
ingress:
  enabled: true
  className: nginx
  host: resolvehub.local
  annotations: {}
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
