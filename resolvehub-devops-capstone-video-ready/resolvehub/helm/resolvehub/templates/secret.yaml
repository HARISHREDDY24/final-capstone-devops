apiVersion: v1
kind: Secret
metadata:
  name: resolvehub-db
  labels:
    {{- include "resolvehub.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.database.user | quote }}
  password: {{ .Values.database.password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@postgres:5432/%s" .Values.database.user .Values.database.password .Values.database.name | quote }}
