services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resolvehub
      POSTGRES_USER: resolvehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolvehub_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolvehub -d resolvehub"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [resolvehub]
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://resolvehub:${POSTGRES_PASSWORD:-resolvehub_local_only}@postgres:5432/resolvehub
      AUTO_CREATE_TABLES: "false"
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [resolvehub]
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["3000:8080"]
    networks: [resolvehub]
    restart: unless-stopped
networks:
  resolvehub: {}
volumes:
  postgres_data: {}
