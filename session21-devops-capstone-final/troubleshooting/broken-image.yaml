# Intentional fault for the troubleshooting lab; do not use as an application deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshooting-broken-image
  namespace: taskboard
  labels:
    app: troubleshooting-broken-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app: troubleshooting-broken-image
  template:
    metadata:
      labels:
        app: troubleshooting-broken-image
    spec:
      containers:
        - name: missing-image
          image: ghcr.io/example-not-real/taskboard-backend:does-not-exist
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
