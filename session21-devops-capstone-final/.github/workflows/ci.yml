name: TaskBoard CI and Container Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run Pytest
        working-directory: backend
        run: pytest -q

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install packages
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-scan-push:
    name: Build, scan, and publish images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Set lowercase image prefix
        shell: bash
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build backend image
        run: docker build --pull -t taskboard-backend:${GITHUB_SHA} ./backend
      - name: Build frontend image
        run: docker build --pull -t taskboard-frontend:${GITHUB_SHA} ./frontend
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: taskboard-backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: taskboard-frontend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push commit-SHA images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "taskboard-backend:${IMAGE_TAG}" "${IMAGE_PREFIX}-backend:${IMAGE_TAG}"
          docker tag "taskboard-frontend:${IMAGE_TAG}" "${IMAGE_PREFIX}-frontend:${IMAGE_TAG}"
          docker push "${IMAGE_PREFIX}-backend:${IMAGE_TAG}"
          docker push "${IMAGE_PREFIX}-frontend:${IMAGE_TAG}"
