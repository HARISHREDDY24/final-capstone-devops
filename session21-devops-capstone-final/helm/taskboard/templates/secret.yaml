apiVersion: v1
kind: Secret
metadata:
  name: taskboard-database
  labels:
    app.kubernetes.io/part-of: taskboard
    app.kubernetes.io/component: database
type: Opaque
stringData:
  username: {{ .Values.postgresql.username | quote }}
  password: {{ .Values.postgresql.password | quote }}
  database: {{ .Values.postgresql.database | quote }}
  url: {{ printf "postgresql+psycopg://%s:%s@postgres:5432/%s" .Values.postgresql.username .Values.postgresql.password .Values.postgresql.database | quote }}
